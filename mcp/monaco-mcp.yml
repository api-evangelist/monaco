server:
  name: monaco
  transport: http
  url: https://mcp.monaco.com/mcp
  auth: oauth2
  auth_detail: >-
    OAuth 2.0; the MCP client handles the flow on first connection. API-key
    bearer auth is also supported for Codex/ChatGPT (bearer-token env var).
  permissions: >-
    Every request is authenticated as the user who completed login and respects
    that user's existing Monaco permissions. Reads are auto-approved by the AI
    client; writes and deletes prompt for confirmation by default.
  rate_limits: 100 requests/minute per organization, shared with the REST API (429 on exceed).
  stability: beta
clients:
- Claude Desktop / Cowork
- ChatGPT (Business/Enterprise/Edu, Developer Mode)
- Codex
- Any MCP-compliant custom client

aid: monaco
name: Monaco
description: >-
  Monaco is an AI-native revenue platform for startups that replaces legacy CRM
  systems and disparate sales point solutions with a single revenue engine.
  It unifies a contacts/accounts database, buying signals, sequences, pipeline
  and opportunity tracking, meeting/call recording with AI summaries, and CRO
  copilot coaching. Monaco exposes a public REST API (api.monaco.com) covering
  contacts, accounts, opportunities, tasks, tags, meetings, sequences, and
  sequence templates, plus a hosted, OAuth-secured MCP server (mcp.monaco.com)
  and shipped Agent Skills so AI agents can query and act on revenue data in
  natural language. Founded by Sam Blond and backed by Founders Fund; the API
  and MCP surface are currently in Beta.

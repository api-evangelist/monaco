          description: LinkedIn profile URL. Either email or linkedin_url is required.
          examples:
          - https://linkedin.com/in/janesmith
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
          description: First name of the contact
          examples:
          - Jane
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
          description: Last name of the contact
          examples:
          - Smith
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: Job title of the contact
          examples:
          - VP of Engineering
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
          description: Phone number of the contact
          examples:
          - +1-555-123-4567
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
          description: Location of the contact
          examples:
          - San Francisco, CA
        account_id:
          anyOf:
          - type: string
